# 하루 1회 수집 → 원문 근거 검증 → 검사 통과 시 콘텐츠 저장·배포. 부족한 자료는 후보 큐에 남긴다.
# 주의: 공개 저장소는 60일 동안 커밋이 없으면 GitHub 이 이 예약 실행을 멈춘다. 멈추면 Actions 탭에서 다시 켠다.
name: pipeline

on:
  schedule:
    - cron: "17 1 * * *" # 한국 시간 매일 10:17. 전날 UTC 날짜 확보·정각 혼잡 회피.
  workflow_dispatch:
    inputs:
      compare_models:
        description: "같은 영상 제목으로 Mini와 Astra 비교 (후보 저장 없음)"
        type: boolean
        default: false
      photos_only:
        description: "음식 수집 없이 기존 사진 준비 중 항목만 검색"
        type: boolean
        default: false
      links_only:
        description: "음식·사진 수집 없이 쿠팡 재료 링크만 확인"
        type: boolean
        default: false
      photo_limit:
        description: "사진 검색 음식 수 (1~20, 예약 실행은 5)"
        type: string
        default: "5"

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.save.outputs.changed }}
      revision: ${{ steps.save.outputs.revision }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run pipeline
        if: inputs.photos_only != true && inputs.links_only != true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NAVER_API_HUB_KEY_ID: ${{ secrets.NAVER_API_HUB_KEY_ID }}
          NAVER_API_HUB_KEY: ${{ secrets.NAVER_API_HUB_KEY }}
          # 공급자·모델은 저장소 변수(Variables)로 바꾼다. 이번 달 openai, 그 뒤 gemini
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          PIPELINE_COMPARE_MODELS: ${{ inputs.compare_models }}
          PIPELINE_AUTO_PUBLISH: ${{ vars.PIPELINE_AUTO_PUBLISH || 'true' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 사진 검색·이용 조건·이미지 일치 자동 확인
        if: inputs.compare_models != true && inputs.links_only != true && vars.PIPELINE_AUTO_PUBLISH != 'false' && vars.PIPELINE_AUTO_PHOTOS != 'false'
        run: npm run photos:auto
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIPELINE_PHOTO_LIMIT: ${{ inputs.photo_limit || '5' }}
      - name: 쿠팡 호출 기록 복원
        id: coupang_cache
        if: inputs.compare_models != true && inputs.photos_only != true && vars.PIPELINE_AUTO_PUBLISH != 'false' && vars.PIPELINE_AUTO_COUPANG == 'true'
        uses: actions/cache/restore@v4
        with:
          path: web/data/coupang-state.json
          key: coupang-search-v1-${{ vars.COUPANG_SUB_ID || 'unconfigured' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            coupang-search-v1-${{ vars.COUPANG_SUB_ID || 'unconfigured' }}-
      - name: 쿠팡 재료 상품·제휴 링크 자동 연결
        id: coupang
        if: inputs.compare_models != true && inputs.photos_only != true && vars.PIPELINE_AUTO_PUBLISH != 'false' && vars.PIPELINE_AUTO_COUPANG == 'true'
        run: npm run links:auto
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ vars.COUPANG_SUB_ID }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 실패·미리보기를 포함한 쿠팡 호출 기록 보존
        if: always() && steps.coupang_cache.outputs.cache-primary-key != '' && steps.coupang.outcome != 'skipped' && hashFiles('web/data/coupang-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: web/data/coupang-state.json
          key: ${{ steps.coupang_cache.outputs.cache-primary-key }}
      - name: 자동 검증 결과 보관 (원문 설명란은 저장하지 않음)
        uses: actions/upload-artifact@v4
        if: always() && inputs.compare_models != true
        with:
          name: automation-report
          path: |
            web/data/automation-report.json
            web/data/photo-report.json
            web/data/coupang-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: 페이지 변경 확인
        id: changes
        run: |
          if git diff --quiet -- src/data/content/foods.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 새 콘텐츠 검사
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run content:check
          npm run lint
          npm run typecheck
          npm run test:unit
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run test:content
      - name: 검사를 통과한 음식만 저장
        id: save
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::검사 중 main이 변경되어 반영을 보류합니다. 다음 실행에서 다시 수집합니다."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/content/foods.json src/data/content/auto-photo-credits.json src/assets/curated src/lib/curated-photos.ts
          git commit -m "콘텐츠: 자동 검증을 통과한 음식·사진·재료 링크 반영"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 실행 요약
        if: always() && inputs.compare_models != true
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const [path, label] of [['data/automation-report.json', '음식'], ['data/photo-report.json', '사진'], ['data/coupang-report.json', '쿠팡 링크']]) {
            if (!fs.existsSync(path)) continue;
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (report.reason) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${label}: ${report.reason}\n\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${label} 자동 검증 결과: 적용 가능 ${report.accepted.length}개 · 보류 ${report.deferred.length}개\n\n${report.accepted.map(item => `- 적용: ${item.name}`).join('\n')}\n${report.deferred.map(item => `- 보류: ${item.name}: ${item.reason}`).join('\n')}\n`);
          }
          NODE
  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      revision: ${{ needs.collect.outputs.revision }}
    secrets: inherit
