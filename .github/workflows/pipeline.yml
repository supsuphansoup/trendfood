# 하루 1회 수집 → 원문 근거 검증 → 검사 통과 시 콘텐츠 저장·배포. 부족한 자료는 후보 큐에 남긴다.
# 주의: 공개 저장소는 60일 동안 커밋이 없으면 GitHub 이 이 예약 실행을 멈춘다. 멈추면 Actions 탭에서 다시 켠다.
name: pipeline

on:
  schedule:
    - cron: "17 1 * * *" # 한국 시간 매일 10:17. 전날 UTC 날짜 확보·정각 혼잡 회피.
  workflow_dispatch:
    inputs:
      pending_only:
        description: "추가 AI 호출 없이 등록한 생성 사진과 원문 재확인으로 대기 음식 공개"
        type: boolean
        default: false
      checks_only:
        description: "외부 수집·AI 호출 없이 현재 콘텐츠와 전체 검사만 실행"
        type: boolean
        default: false
      compare_models:
        description: "같은 영상 제목으로 Mini와 Astra 비교 (후보 저장 없음)"
        type: boolean
        default: false
      photos_only:
        description: "원고 생성 없이 대기 원문 재확인·실사 검색·참고 사진 기반 생성"
        type: boolean
        default: false
      links_only:
        description: "음식·사진 수집 없이 쿠팡 재료 링크만 확인"
        type: boolean
        default: false
      photo_limit:
        description: "사진 검색 음식 수 (1~20, 예약 실행은 5)"
        type: string
        default: "5"

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # 이미지 생성 0회가 확인된 현재 실행의 미사용 캐시 예약만 반환

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.save.outputs.changed }}
      revision: ${{ steps.save.outputs.revision }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 음식 후보 관찰·사진 대기 기록 복원
        id: discovery_cache
        if: inputs.checks_only != true && inputs.compare_models != true && inputs.links_only != true
        uses: actions/cache/restore@v4
        with:
          path: web/data/discovery-state.json
          key: food-discovery-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            food-discovery-v1-
      - run: npm run pipeline
        if: inputs.pending_only != true && inputs.checks_only != true && inputs.photos_only != true && inputs.links_only != true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NAVER_API_HUB_KEY_ID: ${{ secrets.NAVER_API_HUB_KEY_ID }}
          NAVER_API_HUB_KEY: ${{ secrets.NAVER_API_HUB_KEY }}
          # 공급자·모델은 저장소 변수(Variables)로 바꾼다. 이번 달 openai, 그 뒤 gemini
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          PIPELINE_COMPARE_MODELS: ${{ inputs.compare_models }}
          PIPELINE_AUTO_PUBLISH: ${{ vars.PIPELINE_AUTO_PUBLISH || 'true' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 등록한 생성 사진·공식 원문으로 사진 대기 음식 반영
        if: inputs.pending_only == true && inputs.checks_only != true && inputs.compare_models != true && inputs.photos_only != true && inputs.links_only != true && vars.PIPELINE_AUTO_PUBLISH != 'false'
        run: node scripts/restore-pending-photos.ts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: 사진 전용 실행의 대기 원고·공식 원문 재확인 (AI 원고 생성 없음)
        if: inputs.photos_only == true && inputs.pending_only != true && inputs.checks_only != true && inputs.compare_models != true && inputs.links_only != true && vars.PIPELINE_AUTO_PUBLISH != 'false'
        run: node scripts/restore-pending-photos.ts --prepare
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: 이미지 생성 한국 날짜·호출 예약 준비
        id: image_day
        if: inputs.pending_only != true && inputs.checks_only != true && inputs.compare_models != true && inputs.links_only != true && vars.PIPELINE_AUTO_PUBLISH != 'false' && vars.PIPELINE_AUTO_PHOTOS != 'false' && vars.PIPELINE_AUTO_IMAGE_GENERATION != 'false'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { imageDate } from './scripts/generated-photo-automation.ts';
          const date = imageDate(new Date());
          fs.mkdirSync('data', { recursive: true });
          fs.writeFileSync('data/image-generation-reservation.json', JSON.stringify({ date }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `key=food-image-generation-day-v1-${date}\n`);
          NODE
      - name: 오늘 이미지 생성 예약 확인
        id: image_reservation
        if: steps.image_day.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: web/data/image-generation-reservation.json
          key: ${{ steps.image_day.outputs.key }}
          lookup-only: true
      - name: 유료 호출 전에 일일 예약 보존 (중단·실패도 당일 추가 생성 금지)
        if: steps.image_day.outputs.key != '' && steps.image_reservation.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: web/data/image-generation-reservation.json
          key: ${{ steps.image_day.outputs.key }}
      - name: 예약 저장 확인 후에만 유료 생성 허용
        id: image_budget
        if: steps.image_day.outputs.key != '' && steps.image_reservation.outputs.cache-hit != 'true'
        run: node scripts/check-image-reservation.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_RESERVATION_KEY: ${{ steps.image_day.outputs.key }}
      - name: 사진 검색·이용 조건·이미지 일치 자동 확인
        if: inputs.pending_only != true && inputs.checks_only != true && inputs.compare_models != true && inputs.links_only != true && vars.PIPELINE_AUTO_PUBLISH != 'false' && vars.PIPELINE_AUTO_PHOTOS != 'false'
        run: npm run photos:auto
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIPELINE_PHOTO_LIMIT: ${{ inputs.photo_limit || '5' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIPELINE_AUTO_IMAGE_GENERATION: ${{ steps.image_budget.outputs.allowed || 'false' }}
      - name: 이미지 생성 시도 0회인 미사용 예약만 반환
        if: steps.image_budget.outputs.allowed == 'true' && hashFiles('web/data/photo-report.json') != ''
        run: node scripts/check-image-reservation.ts --release-unused
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_RESERVATION_KEY: ${{ steps.image_day.outputs.key }}
      - name: 사진 검증 후 신규 음식 우선·일일 추천 갱신 (추가 API 호출 없음)
        if: inputs.pending_only != true && inputs.checks_only != true && inputs.compare_models != true && inputs.links_only != true && vars.PIPELINE_AUTO_PUBLISH != 'false'
        run: node scripts/refresh-recommendations.ts
      - name: 쿠팡 호출 기록 복원
        id: coupang_cache
        if: inputs.pending_only != true && inputs.checks_only != true && inputs.compare_models != true && inputs.photos_only != true && vars.PIPELINE_AUTO_PUBLISH != 'false' && vars.PIPELINE_AUTO_COUPANG == 'true'
        uses: actions/cache/restore@v4
        with:
          path: web/data/coupang-state.json
          key: coupang-search-v1-${{ vars.COUPANG_SUB_ID || 'unconfigured' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            coupang-search-v1-${{ vars.COUPANG_SUB_ID || 'unconfigured' }}-
      - name: 쿠팡 재료 상품·제휴 링크 자동 연결
        id: coupang
        if: inputs.pending_only != true && inputs.checks_only != true && inputs.compare_models != true && inputs.photos_only != true && vars.PIPELINE_AUTO_PUBLISH != 'false' && vars.PIPELINE_AUTO_COUPANG == 'true'
        run: npm run links:auto
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ vars.COUPANG_SUB_ID }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 실패·미리보기를 포함한 쿠팡 호출 기록 보존
        if: always() && steps.coupang_cache.outputs.cache-primary-key != '' && steps.coupang.outcome != 'skipped' && hashFiles('web/data/coupang-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: web/data/coupang-state.json
          key: ${{ steps.coupang_cache.outputs.cache-primary-key }}
      - name: 일반 상품 검색 기록 복원
        id: product_cache
        if: inputs.pending_only != true && inputs.checks_only != true && inputs.compare_models != true && inputs.photos_only != true && vars.PIPELINE_AUTO_PUBLISH != 'false' && vars.PIPELINE_AUTO_COUPANG != 'true' && vars.PIPELINE_AUTO_PRODUCT_LINKS == 'true'
        uses: actions/cache/restore@v4
        with:
          path: web/data/product-link-state.json
          key: product-links-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            product-links-v1-
      - name: 일반 쿠팡 상품 상세주소 검색·재료 대조
        id: products
        if: inputs.pending_only != true && inputs.checks_only != true && inputs.compare_models != true && inputs.photos_only != true && vars.PIPELINE_AUTO_PUBLISH != 'false' && vars.PIPELINE_AUTO_COUPANG != 'true' && vars.PIPELINE_AUTO_PRODUCT_LINKS == 'true'
        run: npm run links:auto -- --web-products
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: 일반 상품 검색 기록 보존
        if: always() && steps.product_cache.outputs.cache-primary-key != '' && steps.products.outcome != 'skipped' && hashFiles('web/data/product-link-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: web/data/product-link-state.json
          key: ${{ steps.product_cache.outputs.cache-primary-key }}
      - name: 실패한 실행도 후보 관찰·사진 대기 기록 보존
        if: always() && steps.discovery_cache.outputs.cache-primary-key != '' && hashFiles('web/data/discovery-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: web/data/discovery-state.json
          key: ${{ steps.discovery_cache.outputs.cache-primary-key }}
      - name: 자동 검증 결과 보관 (원문 설명란은 저장하지 않음)
        uses: actions/upload-artifact@v4
        if: always() && inputs.compare_models != true && inputs.checks_only != true
        with:
          name: automation-report
          path: |
            web/data/automation-report.json
            web/data/discovery-report.json
            web/data/recommendation-report.json
            web/data/photo-report.json
            web/data/coupang-report.json
            web/data/product-link-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: 페이지 변경 확인
        id: changes
        run: |
          if git diff --quiet -- src/data/content/foods.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 새 콘텐츠 검사
        if: steps.changes.outputs.changed == 'true' || inputs.checks_only == true
        run: |
          npm run content:check
          npm run lint
          npm run typecheck
          npm run test:unit
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run test:content
      - name: 실패한 브라우저 검사 화면·오류 문맥 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failure
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: 검사를 통과한 음식만 저장
        id: save
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::검사 중 main이 변경되어 반영을 보류합니다. 다음 실행에서 다시 수집합니다."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/content/foods.json src/data/content/auto-photo-credits.json src/assets/curated src/lib/curated-photos.ts src/data/content/generated-images.json src/assets/generated src/lib/generated-photos.ts
          git commit -m "콘텐츠: 검증된 음식·사진·재료 링크와 일일 추천 반영"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: 실행 요약
        if: always() && inputs.compare_models != true
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          if (fs.existsSync('data/discovery-report.json')) {
            const discovery = JSON.parse(fs.readFileSync('data/discovery-report.json', 'utf8'));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `음식 발견: 검색 ${discovery.searchCalls}/10회 · 추적 채널 ${discovery.watchedChannels}개 · 음식 관련 RSS ${discovery.rssItems}개\n\n음식명 재검색: ${discovery.followed.join(', ')}\n\n${discovery.observations.map(item => `- ${item.name}: ${item.stage} · 관찰 ${item.days.length}일 · 최근 제작자 ${item.creators}명`).join('\n')}\n\n${discovery.warnings.join('\n')}\n\n`);
          }
          for (const [path, label] of [['data/automation-report.json', '음식 검증'], ['data/recommendation-report.json', '공개 추천'], ['data/photo-report.json', '사진'], ['data/coupang-report.json', '쿠팡 제휴 링크'], ['data/product-link-report.json', '일반 상품 링크']]) {
            if (!fs.existsSync(path)) continue;
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (report.generated) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `참고 사진 기반 AI 생성: ${report.generated.length}개 · 하루 최대 1회 (실패도 차감)\n\n${report.generated.map(item => `- 생성·검증 통과: ${item.name}`).join('\n')}\n\n`);
            if (report.reason) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${label}: ${report.reason}\n\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${label} 자동 검증 결과: 적용 가능 ${report.accepted.length}개 · 보류 ${report.deferred.length}개\n\n${report.accepted.map(item => `- 적용: ${item.name}`).join('\n')}\n${report.deferred.map(item => `- 보류: ${item.name}: ${item.reason}`).join('\n')}\n`);
          }
          NODE
  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      revision: ${{ needs.collect.outputs.revision }}
    secrets: inherit
  notify:
    needs: [collect, publish]
    if: always() && !cancelled() && inputs.pending_only != true && inputs.compare_models != true && inputs.checks_only != true && inputs.photos_only != true && inputs.links_only != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 실패 알림 갱신·복구 시 종료
        run: node web/scripts/automation-alert.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPELINE_RESULT: ${{ (needs.collect.result == 'failure' || needs.publish.result == 'failure') && 'failure' || 'success' }}
